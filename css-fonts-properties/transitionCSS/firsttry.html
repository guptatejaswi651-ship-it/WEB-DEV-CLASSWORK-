<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition property</title>
    <style>
        div {
            width : 400px;
            height : 400px;
            background-color : lightblue;
            transition : width 2s , height 2s , background-color 2s;
        }
        div:hover {
            width :800px;
            height : 200px;
            background-color : red;
        }
    </style>
</head>
<body>
    <div>



    </div>
</body>
</html>
