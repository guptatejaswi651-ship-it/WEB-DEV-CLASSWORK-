<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.S-3</title>
    <style>
    *{
        box-sizing: border-box;
    padding : 0;
    margin: 0;

    }
     .box {
        position:relative;
        width: 600px;
        height:400px;
        background-color:burlywood;
        
                 }

     .middle-right {
        position:absolute;
       top: 45%;
       right: 8px;
       font-size: 20px;
               }



    .middle-left {
        position:absolute;
        top: 45%;
        left: 8px;
        font-size: 20px;
             }

    .bottom-center {
        position:absolute;
        bottom: 8px;
        left: 250px;
        font-size: 20px;

                  }

   .top-center{
        position:absolute;
        top: 8px;
        left:250px;
        font-size: 20px;
            }



    </style>
</head>
<body>
    <div class="box">
      <div class="middle-left">
        <h1>Tejaswi</h1>
    </div>
    <div class="middle-right">
        <h1>Tejaswi</h1>
    </div>
    <div class="bottom-center">
        <h1>Tejaswi</h1>
    </div>
    <div class="top-center">
        <h1>Tejaswi</h1>
    </div>




    </div>
</body>
</html>
