<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Gallery </title>
    <style>
        body{
            background-color: #ead5dd;
        }

        .Container{
            display:grid;
            grid-template-columns:repeat(3,3fr);
            gap:20px;
            grid-gap:0.5em;
            align-items:center;
            align-content: space-around;
            justify-content: center;
        }
        .grid-template{
            justify-content: center;
            height:200px;
            width:200px;
            padding:10px;
            border-radius: 5%;
            background-color:rgb(6, 28, 18);
        }
        img{
            width:200px;
            height:200px;
            border-radius: 5%;
            align-items: center;
            object-fit:cover;
        }
        @media (max-width: 768px) {
            .Container {
                grid-template-columns: repeat(2, 5fr);
            }
        }

        @media (max-width: 600px) {
            .Container {
                grid-template-columns: repeat(1, 9fr);
            }
        }
        
        @media (min-width: 992px) {
            .Container {
                grid-template-columns: repeat(3, 3fr);
            }
        }


    </style>
</head>

<body>
    <div class="Container">
     <div class="grid-template">
     <img src="assets/image1.jpeg" alt="photo1">
     </div>
      <div class="grid-template">
     <img src="assets/image2.jpeg" alt="photo2">
      </div>
      <div class="grid-template">
     <img src="assets/image3.jpeg" alt="photo3">
     </div>
      <div class="grid-template">
     <img src="assets/image4.jpeg"alt="photo4">
      </div>
      <div class="grid-template">
     <img src="assets/image5.jpeg"alt="photo5">
      </div>
      <div class="grid-template">
     <img src="assets/image6.jpeg"alt="photo6">
      </div>
      <div class="grid-template">
     <img src="assets/image7.jpeg"alt="photo7">
     </div>
     <div class="grid-template">
     <img src="assets/image8.jpeg"alt="photo8">
     </div>
     <div class="grid-template">
     <img src="assets/image9.jpeg"alt="photo9">
    </div>
</body>
</html>
